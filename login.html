<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Acceso · RoomieMatch</title>
        <link rel="stylesheet" href="css/style.css">
        </head>
        <body>
        <main class="login">
          <div class="login-caja">
              <div class="logo">RoomieMatch</div>
                  <p class="lema">Más que una habitación, es la persona correcta.</p>

                      <div class="tabs">
                            <button id="tabEntrar" class="tab activa" type="button">Iniciar sesión</button>
                                  <button id="tabCrear" class="tab" type="button">Crear cuenta</button>
                                      </div>

                                          <button id="btnGoogle" class="btn claro total" type="button">Continuar con Google</button>
                                              <p class="separador"><span>o con tu correo</span></p>

                                                  <form id="form" novalidate>
                                                        <label id="lblNombre" class="campo" hidden>Nombre
                                                                <input id="nombre" autocomplete="name">
                                                                      </label>
                                                                            <label class="campo">Correo
                                                                                    <input id="correo" type="email" autocomplete="email">
                                                                                          </label>
                                                                                                <label class="campo">Contraseña
                                                                                                        <input id="pass" type="password" autocomplete="current-password">
                                                                                                              </label>
                                                                                                                    <label id="lblPass2" class="campo" hidden>Repite la contraseña
                                                                                                                            <input id="pass2" type="password" autocomplete="new-password">
                                                                                                                                  </label>
                                                                                                                                        <button id="btnEnviar" class="btn total" type="submit">Entrar</button>
                                                                                                                                            </form>

                                                                                                                                                <button id="btnOlvide" class="enlace" type="button">¿Olvidaste tu contraseña?</button>
                                                                                                                                                    <p id="aviso" class="aviso-login" role="alert"></p>
                                                                                                                                                      </div>
                                                                                                                                                      </main>

                                                                                                                                                      <script type="module">
                                                                                                                                                        import { auth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "./js/firebase.js";
                                                                                                                                                          import { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail }
                                                                                                                                                              from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

                                                                                                                                                                const $ = (id) => document.getElementById(id);
                                                                                                                                                                  let modoCrear = false;
                                                                                                                                                                    let ocupado = false;

                                                                                                                                                                      // Si ya hay sesión, pasa directo a la app
                                                                                                                                                                        onAuthStateChanged(auth, (user) => { if (user && !ocupado) location.href = "index.html"; });

                                                                                                                                                                          const ERRORES = {
                                                                                                                                                                              "auth/invalid-credential": "Correo o contraseña incorrectos.",
                                                                                                                                                                                  "auth/invalid-email": "El correo no es válido.",
                                                                                                                                                                                      "auth/email-already-in-use": "Ya existe una cuenta con ese correo. Prueba iniciar sesión.",
                                                                                                                                                                                          "auth/weak-password": "La contraseña es muy débil.",
                                                                                                                                                                                              "auth/too-many-requests": "Demasiados intentos. Espera un momento e inténtalo de nuevo.",
                                                                                                                                                                                                  "auth/popup-closed-by-user": "Cerraste la ventana de Google antes de terminar.",
                                                                                                                                                                                                      "auth/popup-blocked": "Tu navegador bloqueó la ventana. Permite ventanas emergentes.",
                                                                                                                                                                                                          "auth/unauthorized-domain": "Este dominio no está autorizado en Firebase.",
                                                                                                                                                                                                              "auth/operation-not-allowed": "Ese método de acceso no está activado en Firebase.",
                                                                                                                                                                                                                  "auth/network-request-failed": "Sin conexión. Revisa tu internet."
                                                                                                                                                                                                                    };
                                                                                                                                                                                                                      const mostrar = (t, ok = false) => {
                                                                                                                                                                                                                          $("aviso").textContent = t;
                                                                                                                                                                                                                              $("aviso").classList.toggle("ok", ok);
                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                  const errorTexto = (e) => ERRORES[e.code] || "Ocurrió un error: " + (e.code || e.message);

                                                                                                                                                                                                                                    function cambiarModo(crear) {
                                                                                                                                                                                                                                        modoCrear = crear;
                                                                                                                                                                                                                                            $("tabEntrar").classList.toggle("activa", !crear);
                                                                                                                                                                                                                                                $("tabCrear").classList.toggle("activa", crear);
                                                                                                                                                                                                                                                    $("lblNombre").hidden = !crear;
                                                                                                                                                                                                                                                        $("lblPass2").hidden = !crear;
                                                                                                                                                                                                                                                            $("btnOlvide").hidden = crear;
                                                                                                                                                                                                                                                                $("btnEnviar").textContent = crear ? "Crear cuenta" : "Entrar";
                                                                                                                                                                                                                                                                    $("pass").autocomplete = crear ? "new-password" : "current-password";
                                                                                                                                                                                                                                                                        mostrar("");
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                            $("tabEntrar").onclick = () => cambiarModo(false);
                                                                                                                                                                                                                                                                              $("tabCrear").onclick = () => cambiarModo(true);

                                                                                                                                                                                                                                                                                // Google
                                                                                                                                                                                                                                                                                  $("btnGoogle").onclick = async () => {
                                                                                                                                                                                                                                                                                      ocupado = true;
                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                await signInWithPopup(auth, new GoogleAuthProvider());
                                                                                                                                                                                                                                                                                                      location.href = "index.html";
                                                                                                                                                                                                                                                                                                          } catch (e) { ocupado = false; mostrar(errorTexto(e)); }
                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                              // Correo y contraseña
                                                                                                                                                                                                                                                                                                                $("form").onsubmit = async (ev) => {
                                                                                                                                                                                                                                                                                                                    ev.preventDefault();
                                                                                                                                                                                                                                                                                                                        const correo = $("correo").value.trim();
                                                                                                                                                                                                                                                                                                                            const pass = $("pass").value;
                                                                                                                                                                                                                                                                                                                                const nombre = $("nombre").value.trim();

                                                                                                                                                                                                                                                                                                                                    if (!correo || !pass) return mostrar("Escribe tu correo y tu contraseña.");
                                                                                                                                                                                                                                                                                                                                        if (modoCrear) {
                                                                                                                                                                                                                                                                                                                                              if (!nombre) return mostrar("Escribe tu nombre.");
                                                                                                                                                                                                                                                                                                                                                    if (pass.length < 8) return mostrar("La contraseña debe tener al menos 8 caracteres.");
                                                                                                                                                                                                                                                                                                                                                          if (pass !== $("pass2").value) return mostrar("Las contraseñas no coinciden.");
                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                  ocupado = true;
                                                                                                                                                                                                                                                                                                                                                                      $("btnEnviar").disabled = true;
                                                                                                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                                                                                                if (modoCrear) {
                                                                                                                                                                                                                                                                                                                                                                                        const cred = await createUserWithEmailAndPassword(auth, correo, pass);
                                                                                                                                                                                                                                                                                                                                                                                                await updateProfile(cred.user, { displayName: nombre });
                                                                                                                                                                                                                                                                                                                                                                                                        location.href = "perfil.html"; // para completar su perfil
                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                      await signInWithEmailAndPassword(auth, correo, pass);
                                                                                                                                                                                                                                                                                                                                                                                                                              location.href = "index.html";
                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                              ocupado = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    $("btnEnviar").disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          mostrar(errorTexto(e));
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // Recuperar contraseña
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $("btnOlvide").onclick = async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const correo = $("correo").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!correo) return mostrar("Escribe tu correo arriba y vuelve a pulsar aquí.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await sendPasswordResetEmail(auth, correo);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            mostrar("Si ese correo tiene cuenta, te enviamos un enlace para cambiar la contraseña.", true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } catch (e) { mostrar(errorTexto(e)); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
