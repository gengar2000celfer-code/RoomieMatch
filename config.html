<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Configuración · RoomieMatch</title>
        <link rel="stylesheet" href="css/style.css">
        </head>
        <body>
        <div id="app" class="app" hidden>
          <aside class="sidebar" id="sidebar"></aside>
            <main class="main">
                <h2>Configuración</h2>

                    <div class="bloque">
                          <h3>Cuenta</h3>
                                <p class="lema">Correo: <strong id="correo"></strong></p>
                                      <p class="lema">Inicio de sesión con: <strong id="proveedor"></strong></p>
                                            <div id="bloquePass" hidden><button id="btnPass" class="btn claro">Cambiar contraseña (te llega un correo)</button></div>
                                                </div>

                                                    <div class="bloque">
                                                          <h3>Sesión</h3>
                                                                <button id="btnSalir" class="btn claro">Cerrar sesión</button>
                                                                    </div>

                                                                        <div class="bloque">
                                                                              <h3>Zona de cuidado</h3>
                                                                                    <p class="lema">Eliminar tu cuenta borra tu perfil y tus favoritos. No se puede deshacer.</p>
                                                                                          <button id="btnEliminar" class="btn">Eliminar cuenta</button>
                                                                                              </div>
                                                                                                  <p id="msg" class="lema"></p>
                                                                                                    </main>
                                                                                                    </div>
                                                                                                    <script type="module">
                                                                                                      import { auth, GoogleAuthProvider, signOut } from "./js/firebase.js";
                                                                                                        import { sendPasswordResetEmail, deleteUser, reauthenticateWithPopup }
                                                                                                            from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
                                                                                                              import { eliminarMisDatos } from "./js/datos.js";
                                                                                                                import { protegerPagina } from "./js/shell.js";

                                                                                                                  const $ = (id) => document.getElementById(id);

                                                                                                                    protegerPagina("config.html", (user) => {
                                                                                                                        const provs = user.providerData.map(p => p.providerId);
                                                                                                                            $("correo").textContent = user.email || "";
                                                                                                                                $("proveedor").textContent = provs.includes("google.com") ? "Google" : "Correo y contraseña";
                                                                                                                                    if (provs.includes("password")) $("bloquePass").hidden = false;

                                                                                                                                        $("btnPass").onclick = async () => {
                                                                                                                                              await sendPasswordResetEmail(auth, user.email);
                                                                                                                                                    $("msg").textContent = "Te enviamos un correo para cambiar tu contraseña.";
                                                                                                                                                        };
                                                                                                                                                            $("btnSalir").onclick = () => signOut(auth).then(() => location.href = "login.html");

                                                                                                                                                                $("btnEliminar").onclick = async () => {
                                                                                                                                                                      if (!confirm("¿Seguro que quieres eliminar tu cuenta?")) return;
                                                                                                                                                                            try {
                                                                                                                                                                                    if (provs.includes("google.com")) await reauthenticateWithPopup(user, new GoogleAuthProvider());
                                                                                                                                                                                            await eliminarMisDatos(user.uid);
                                                                                                                                                                                                    await deleteUser(user);
                                                                                                                                                                                                            location.href = "index.html";
                                                                                                                                                                                                                  } catch (e) { $("msg").textContent = "No se pudo eliminar: " + e.code; }
                                                                                                                                                                                                                      };
                                                                                                                                                                                                                        });
                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                        </html>
