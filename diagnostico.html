<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico del Index</title>
  <style>
    body{font:16px system-ui;background:#F3FAF2;color:#4E8F5B;padding:16px}
    li{margin:10px 0;word-break:break-word}
    .ok{font-weight:600}
    .mal{font-weight:800;text-decoration:underline}
  </style>
</head>
<body>
<h2>Diagnóstico del Index</h2>
<ul id="r"></ul>
<script type="module">
  const r = document.getElementById("r");
  const log = (ok, t) => { const li = document.createElement("li"); li.className = ok ? "ok" : "mal"; li.textContent = (ok ? "✓ " : "✗ ") + t; r.appendChild(li); };

  let html = "";
  try {
    const x = await fetch("index.html?v=" + Date.now(), { cache: "no-store" });
    log(x.ok, "Descargar index.html (HTTP " + x.status + ", " + (x.headers.get("content-length") || "?") + " bytes)");
    html = await x.text();
  } catch (e) { log(false, "No se pudo descargar index.html"); }

  if (html) {
    log(html.includes('id="cargaInicial"') && html.includes("Resultados de compatibilidad"), "Es la versión nueva del Index");
    log(html.includes("css/inicio.css"), "Enlaza css/inicio.css");

    const modulos = html.match(/<script type="module">/g) || [];
    log(modulos.length === 1, "Scripts de tipo módulo: " + modulos.length + " (debe ser 1)");

    const m = html.match(/<script type="module">([\s\S]*?)<\/script>/);
    if (m) {
      const codigo = m[1].replace(/import\s*\{[^}]*\}\s*from\s*"[^"]+";?/g, "");
      try {
        const AF = Object.getPrototypeOf(async function () {}).constructor;
        new AF(codigo); // solo comprueba la sintaxis, no ejecuta nada
        log(true, "El script del Index no tiene errores de sintaxis");
      } catch (e) { log(false, "Error de sintaxis en el script del Index: " + e.message); }

      const doc = new DOMParser().parseFromString(html, "text/html");
      const ids = new Set();
      for (const x of codigo.matchAll(/\$\("([A-Za-z0-9_-]+)"\)/g)) ids.add(x[1]);
      for (const x of codigo.matchAll(/getElementById\("([A-Za-z0-9_-]+)"\)/g)) ids.add(x[1]);
      const faltan = [...ids].filter((id) => !doc.getElementById(id));
      log(!faltan.length, faltan.length ? "Faltan elementos en el HTML: " + faltan.join(", ") : "Todos los elementos que usa el código existen (" + ids.size + ")");
    } else log(false, "No se encontró el script de tipo módulo");
  }

  try {
    const c = await fetch("css/inicio.css?v=" + Date.now(), { cache: "no-store" });
    log(c.ok, "Descargar css/inicio.css (HTTP " + c.status + ")");
  } catch (e) { log(false, "No se pudo descargar css/inicio.css"); }

  log(true, "Fin del diagnóstico");
</script>
</body>
</html>
